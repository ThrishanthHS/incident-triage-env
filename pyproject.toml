[project]
name = "incident-triage-env"
version = "1.0.0"
description = "An RL environment where AI agents act as SRE engineers — triaging server incidents, reading logs, and diagnosing root causes."
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "python-dotenv",
    "openai",
    "openenv-core>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest", "requests"]



[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:BuildBackend"

[tool.openenv]
name = "incident-triage-env"
version = "1.0.0"

framework = "fastapi"

[project.scripts]
serve = "api.app:app"


entry_point = "api.app:app"