[project]
name = "incident-triage-env"
version = "1.0.0"
description = "An RL environment where AI agents act as SRE engineers."
requires-python = ">=3.10"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "httpx",
    "python-dotenv",
    "openai",
    "openenv-core>=0.2.0",
]

[project.scripts]
serve = "server.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:BuildBackend"

[tool.openenv]
name = "incident-triage-env"
version = "1.0.0"
entry_point = "server.app:main"
framework = "fastapi"
